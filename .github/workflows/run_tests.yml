name: Python autotests

permissions:
  contents: read
  pages: write
  id-token: write

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4
        
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run tests
        run: pytest --alluredir=allure-results
        continue-on-error: true
        
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          
      - name: Install Allure
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          sudo tar -zxvf allure-2.32.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.32.0/bin/allure /usr/local/bin/allure
          allure --version
          
      - name: Generate report
        if: always()
        run: allure generate -c allure-results -o _site
        
      - name: Save allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    name: Report publication
    runs-on: ubuntu-latest
    needs: run-tests  # ждем завершения тестов
    if: always()  # публикуем даже если тесты упали
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: _site
          path: _site
          
      - name: Upload Pages artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
