name: Python autotests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: run tests
        run: pytest --alluredir=allure-results
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Install Allure
        run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.45.0/allure-2.45.0.tgz && sudo tar -zxvf allure-2.45.0.tgz -C /opt/ && sudo ln -s /opt/aluure-2.45.0/bin/allure /usr/binallure
        
        
